<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE - Industrial Access & Authentication</title>
    <!-- Apply theme before render to prevent flash -->
    <script>
        (function () {
            var t = localStorage.getItem("forge_theme") || "dark";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Industrial Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <!-- Theme Toggle — top right corner of login page -->
        <div class="login-theme-toggle-wrapper">
            <div class="theme-toggle" role="group" aria-label="Theme selector">
                <button class="theme-toggle-btn" id="loginThemeBtnLight" title="Switch to Light Mode" aria-pressed="false">&#9728; Light</button>
                <span class="theme-toggle-divider" aria-hidden="true"></span>
                <button class="theme-toggle-btn" id="loginThemeBtnDark" title="Switch to Dark Mode" aria-pressed="true">&#9790; Dark</button>
            </div>
        </div>

        <div class="login-container">

            <div class="login-split-card">

                <!-- Left Panel: Brand & Headline -->
                <div class="login-brand-panel">
                    <div>
                        <div class="brand-wordmark">FORGE</div>
                        <div class="login-headline">
                            BUILT TO KEEP<br>
                            <span>INDUSTRY</span> MOVING.
                        </div>
                        <p class="login-support-text">
                            A centralized platform for equipment maintenance, work orders, workforce coordination and resource management.
                        </p>
                    </div>

                    <div class="login-brand-footer d-flex justify-content-between align-items-center">
                        <span>SYSTEM SPEC 3.4 // PRODUCTION</span>
                        <a href="index.html" class="text-gold text-decoration-none">&larr; Product Overview</a>
                    </div>
                </div>

                <!-- Right Panel: Login Form -->
                <div class="login-form-panel">

                    <div class="login-form-header">
                        <h3>OPERATIONS CONSOLE</h3>
                        <p>Authenticate with credentials to access plant floor telemetry.</p>
                    </div>

                    <!-- Quick Preset Selectors for Lab Testing / Viva -->
                    <div class="quick-role-presets">
                        <button type="button" class="btn-role-preset" onclick="fillRole('admin', 'admin123', 'Administrator')">Admin</button>
                        <button type="button" class="btn-role-preset" onclick="fillRole('tech_rajesh', 'tech123', 'Technician')">Technician</button>
                        <button type="button" class="btn-role-preset" onclick="fillRole('op_floor', 'oper123', 'Operator')">Operator</button>
                    </div>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label for="username" class="form-label">Operator / ID</label>
                            <input type="text" id="username" class="form-control" placeholder="Enter username (e.g. admin)" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Passcode</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                        </div>

                        <div class="mb-4">
                            <label for="role" class="form-label">Assigned Role</label>
                            <select id="role" class="form-select" required>
                                <option value="">Select Role</option>
                                <option value="Administrator">Administrator</option>
                                <option value="Technician">Technician</option>
                                <option value="Operator">Operator</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            AUTHENTICATE &amp; ENTER FORGE &rarr;
                        </button>

                        <p id="loginMessage"></p>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login Page Theme Toggle Logic -->
    <script>
        (function () {
            var currentTheme = localStorage.getItem("forge_theme") || "dark";
            var btnLight = document.getElementById("loginThemeBtnLight");
            var btnDark = document.getElementById("loginThemeBtnDark");

            function syncLoginToggle(theme) {
                btnLight.classList.toggle("active", theme === "light");
                btnLight.setAttribute("aria-pressed", String(theme === "light"));
                btnDark.classList.toggle("active", theme === "dark");
                btnDark.setAttribute("aria-pressed", String(theme === "dark"));
            }

            syncLoginToggle(currentTheme);

            btnLight.addEventListener("click", function () {
                document.documentElement.setAttribute("data-theme", "light");
                localStorage.setItem("forge_theme", "light");
                syncLoginToggle("light");
            });

            btnDark.addEventListener("click", function () {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem("forge_theme", "dark");
                syncLoginToggle("dark");
            });
        })();

        function fillRole(u, p, r) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
            document.getElementById('role').value = r;
        }
    </script>

    <!-- Core Login Logic -->
    <script src="js/app.js"></script>

</body>

</html>
